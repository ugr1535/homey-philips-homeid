<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Espresso Now</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: light;
      --surface: #fffaf4; --text: #2d211c; --muted: #796a62; --edge: rgba(76, 47, 30, .12);
      --chip: #f5e8db; --accent: #9b582f; --track: #e9d9c8; }
    html.homey-dark-mode, body.homey-dark-mode { color-scheme: dark; --surface: #27201d; --text: #fff6ee;
      --muted: #c4afa1; --edge: rgba(255, 255, 255, .1); --chip: #3b302a; --accent: #dc9c6b; --track: #534137; }
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; color: var(--text); }
    .card { position: relative; height: 100vh; min-height: 300px; padding: 15px; border: 1px solid var(--edge); border-radius: 26px;
      background: var(--surface); display: flex; flex-direction: column; overflow: hidden; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-width: 0; }
    .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
    .device { margin-top: 3px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { flex: none; border-radius: 99px; padding: 6px 10px; background: var(--chip); color: var(--accent);
      font-size: 11px; font-weight: 700; max-width: 92px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .top-actions { flex: none; display: flex; align-items: center; gap: 8px; }
    .power { flex: none; display: grid; place-items: center; width: 38px; height: 38px; padding: 0; border: 0;
      border-radius: 50%; background: var(--chip); color: var(--muted); cursor: pointer; }
    .power.active { color: var(--accent); }
    .power svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2.3;
      stroke-linecap: round; stroke-linejoin: round; }
    .power[hidden] { display: none; }
    .content { flex: 1; display: flex; align-items: center; gap: 17px; min-height: 104px; }
    .art { flex: none; width: 104px; height: 104px; border-radius: 24px; display: flex; align-items: center;
      justify-content: center; background: linear-gradient(145deg, #f1dcc5, #e7c5a3); overflow: hidden; }
    .art.original { background: #11172b; }
    .art img { width: 88px; height: 88px; object-fit: contain; }
    .art .source { flex: none; width: 104px; height: 104px; background-repeat: no-repeat; background-color: #11172b; }
    .art img[hidden], .art .source[hidden] { display: none; }
    .copy { min-width: 0; }
    h1 { margin: 0 0 5px; font-size: clamp(18px, 6vw, 25px); line-height: 1.08; letter-spacing: -.03em;
      overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .detail { color: var(--muted); font-size: 12px; line-height: 1.35; }
    .maintenance { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin: 0 0 7px; }
    .maintenance[hidden], .metric[hidden], .footer[hidden] { display: none; }
    .metric { min-width: 0; padding: 6px 8px; background: var(--chip); border-radius: 12px; }
    .metric-line { display: flex; align-items: baseline; justify-content: space-between; gap: 4px; }
    .metric-label { color: var(--muted); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .metric-value { color: var(--text); font-size: 14px; font-weight: 750; flex: none; }
    .metric.low .metric-value { color: #b65b2a; }
    .metric.critical .metric-value { color: #c63030; }
    .metric-track { height: 3px; margin-top: 5px; background: var(--track); border-radius: 3px; overflow: hidden; }
    .metric-fill { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
    .metric.low .metric-fill { background: #d98038; }
    .metric.critical .metric-fill { background: #d34d4d; }
    .footer { min-height: 12px; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 10px; }
    .progress { flex: 1; height: 5px; border-radius: 9px; overflow: hidden; background: var(--track); display: none; }
    .progress > span { display: block; height: 100%; width: 0%; background: var(--accent); border-radius: inherit; }
    .progress.active { display: block; }
    .progress.indeterminate > span { width: 35%; animation: move 1.6s ease-in-out infinite alternate; }
    .open-brew, .start-brew { border: 0; border-radius: 12px; background: var(--accent); color: var(--surface);
      font: inherit; font-size: 13px; font-weight: 750; min-height: 36px; cursor: pointer; }
    .open-brew { flex: none; margin-top: 5px; }
    .open-brew[hidden], .brew-panel[hidden] { display: none; }
    button:disabled { opacity: .5; cursor: default; }
    .brew-panel { position: absolute; inset: 0; z-index: 2; padding: 15px; background: var(--surface);
      border-radius: inherit; display: flex; flex-direction: column; gap: 9px; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .panel-title { margin: 0; font-size: 18px; line-height: 1.1; }
    .panel-close { border: 0; background: var(--chip); color: var(--text); width: 32px; height: 32px;
      border-radius: 50%; font: inherit; font-size: 18px; cursor: pointer; }
    .brew-label { display: grid; gap: 4px; font-size: 11px; color: var(--muted); }
    .brew-select { width: 100%; height: 39px; border-radius: 10px; border: 1px solid var(--edge); padding: 0 10px;
      background: var(--chip); color: var(--text); font: inherit; font-size: 16px; }
    .brew-feedback { flex: 1; min-height: 24px; color: var(--muted); font-size: 11px; line-height: 1.25; }
    .start-brew { flex: none; min-height: 40px; }
    @keyframes move { from { transform: translateX(0); } to { transform: translateX(186%); } }
    @media (max-width: 320px) { .card { padding: 15px; } .art { width: 82px; height: 82px; border-radius: 20px; }
      .art img { width: 72px; height: 72px; } .art .source { transform: scale(.79); } .content { gap: 11px; } }
  </style>
</head>

  <main class="card" aria-live="polite">
    <div class="top"><div style="min-width:0"><div class="eyebrow" id="heading">ESPRESSO NOW</div>
      <div class="device" id="device">—</div></div><div class="top-actions"><span class="badge" id="badge">—</span>
      <button class="power" id="power" type="button" aria-label="Turn on" aria-pressed="false" disabled hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v9M5.6 5.6a9 9 0 1 0 12.8 0"/></svg>
      </button></div></div>
    <div class="content"><div class="art" id="artbox"><img id="art" src="./images/generic.svg" alt="">
      <div class="source" id="source" role="img" hidden></div></div>
      <div class="copy"><h1 id="name">Loading…</h1><div class="detail" id="detail">Waiting for machine status</div></div></div>
    <div class="maintenance" id="maintenance" hidden>
      <div class="metric" id="metric-aquaclean"><div class="metric-line"><span class="metric-label" id="label-aquaclean"></span><span class="metric-value" id="value-aquaclean"></span></div><div class="metric-track"><span class="metric-fill" id="fill-aquaclean"></span></div></div>
      <div class="metric" id="metric-descale"><div class="metric-line"><span class="metric-label" id="label-descale"></span><span class="metric-value" id="value-descale"></span></div><div class="metric-track"><span class="metric-fill" id="fill-descale"></span></div></div>
      <div class="metric" id="metric-coffee"><div class="metric-line"><span class="metric-label" id="label-coffee"></span><span class="metric-value" id="value-coffee"></span></div><div class="metric-track"><span class="metric-fill" id="fill-coffee"></span></div></div>
      <div class="metric" id="metric-brewGroup"><div class="metric-line"><span class="metric-label" id="label-brewGroup"></span><span class="metric-value" id="value-brewGroup"></span></div><div class="metric-track"><span class="metric-fill" id="fill-brewGroup"></span></div></div>
    </div>
    <div class="footer" id="footer" hidden><div class="progress" id="progress"><span id="fill"></span></div>
      <span id="percent"></span></div>
    <button class="open-brew" id="open-brew" type="button" hidden></button>
    <section class="brew-panel" id="brew-panel" aria-labelledby="panel-title" hidden>
      <div class="panel-head"><h2 class="panel-title" id="panel-title"></h2>
        <button class="panel-close" id="panel-close" type="button" aria-label="Close">×</button></div>
      <label class="brew-label" for="profile-select"><span id="profile-label"></span>
        <select class="brew-select" id="profile-select"></select></label>
      <label class="brew-label" for="recipe-select"><span id="recipe-label"></span>
        <select class="brew-select" id="recipe-select"></select></label>
      <div class="brew-feedback" id="brew-feedback" role="status"></div>
      <button class="start-brew" id="start-brew" type="button" disabled></button>
    </section>
  </main>

    function normalizedDrink(name) {

      }
      ui.maintenance.hidden = !visible;
    }

    function drinkArt(name) {
      const value = String(name || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
      if (/water/.test(value)) return 'water';
      if (/iced|cold|galao/.test(value)) return 'iced';
      if (/cappuccino|flat white|froth|babyccino/.test(value)) return 'cappuccino';
      if (/latte|macchiato|cortado|piccolo|melange/.test(value)) return 'latte';
      if (/americano|long black|coffee|crema|au lait/.test(value)) return 'coffee';
      if (/espresso|ristretto|red eye|black eye/.test(value)) return 'espresso';
      return 'generic';
    }

    function fillOptions(select, entries) {
      select.replaceChildren(...entries.map(({ slot, name }) => {
        const option = document.createElement('option');
        option.value = String(slot);
        option.textContent = name;
        return option;
      }));
      select.disabled = entries.length === 0;
    }

    function updateBrewButton() {
      ui['open-brew'].disabled = !lastStatus?.canStartBrew || powerSending || Boolean(powerPending);
      ui['open-brew'].title = ui['open-brew'].disabled ? t.notReady : t.openBrew;
      const profileSlot = Number(ui['profile-select'].value);
      const recipeSlot = Number(ui['recipe-select'].value);
      const profile = brewMenu?.profiles?.find((entry) => entry.slot === profileSlot);
      const validRecipe = profile?.recipes?.some((entry) => entry.slot === recipeSlot);
      ui['start-brew'].disabled = !validRecipe || !lastStatus?.canStartBrew || brewSending || powerSending || Boolean(powerPending)
        || Date.now() - lastBrewSentAt < 15000;
    }

    function updatePowerButton() {
      const powered = lastStatus?.powerOn === true;
      const label = powerSending || powerPending ? t.powerBusy : powered ? t.powerOff : t.powerOn;
      ui.power.hidden = !deviceId;
      ui.power.disabled = !lastStatus?.canControlPower || typeof lastStatus.powerOn !== 'boolean'
        || powerSending || Boolean(powerPending);
      ui.power.classList.toggle('active', powered);
      ui.power.setAttribute('aria-pressed', String(powered));
      ui.power.setAttribute('aria-label', label);
      ui.power.title = label;
    }

    function queuePowerRefresh() {
      if (!powerPending || powerPollTimer) return;
      powerPollTimer = window.setTimeout(async () => {
        powerPollTimer = null;
        await refresh();
        if (!powerPending) return;
        if (Date.now() - powerPending.since >= 30000) {
          powerPending = null;
          updatePowerButton();
          ui.detail.textContent = t.powerTimeout;
        } else queuePowerRefresh();
      }, 3000);
    }

    async function togglePower() {
      if (!homey || !deviceId || powerSending || powerPending || !lastStatus?.canControlPower
        || typeof lastStatus.powerOn !== 'boolean') return;
      const enabled = !lastStatus.powerOn;
      powerSending = true;
      updatePowerButton();
      updateBrewButton();
      ui.detail.textContent = t.powerBusy;
      try {
        await homey.api('POST', `/power/${encodeURIComponent(deviceId)}`, { enabled });
        powerPending = { enabled, since: Date.now() };
        queuePowerRefresh();
      } catch (error) {
        ui.detail.textContent = t.powerFailed;
      } finally {
        powerSending = false;
        updatePowerButton();
        updateBrewButton();
      }
    }

    function renderRecipeOptions() {
      const profileSlot = Number(ui['profile-select'].value);
      const profile = brewMenu?.profiles?.find((entry) => entry.slot === profileSlot);
      fillOptions(ui['recipe-select'], profile?.recipes || []);
      ui['brew-feedback'].textContent = !profile?.recipes?.length ? t.noRecipes
        : !lastStatus?.canStartBrew ? t.notReady : '';
      updateBrewButton();
    }

    async function openBrewPanel() {
      if (!homey || !deviceId || menuLoading || !lastStatus?.canStartBrew || powerSending || powerPending) return;
      ui['brew-panel'].hidden = false;
      ui['brew-feedback'].textContent = t.loading;
      fillOptions(ui['profile-select'], []);
      fillOptions(ui['recipe-select'], []);
      updateBrewButton();
      menuLoading = true;
      try {
        brewMenu = await homey.api('GET', `/brew-menu/${encodeURIComponent(deviceId)}`, {});
        if (!brewMenu?.supported || !brewMenu.profiles?.length) {
          ui['brew-feedback'].textContent = t.noProfiles;
          return;
        }
        fillOptions(ui['profile-select'], brewMenu.profiles);
        if (brewMenu.profiles.some((entry) => entry.slot === brewMenu.selectedProfile)) {
          ui['profile-select'].value = String(brewMenu.selectedProfile);
        }
        renderRecipeOptions();
      } catch (error) {
        brewMenu = null;
        ui['brew-feedback'].textContent = t.menuFailed;
      } finally { menuLoading = false; }
    }

    async function startSavedBrew() {
      if (!homey || !deviceId || brewSending) return;
      if (!lastStatus?.canStartBrew) { ui['brew-feedback'].textContent = t.notReady; return; }
      if (Date.now() - lastBrewSentAt < 15000) { ui['brew-feedback'].textContent = t.duplicate; return; }
      updateBrewButton();
      if (ui['start-brew'].disabled) return;
      const profileSlot = Number(ui['profile-select'].value);
      const recipeSlot = Number(ui['recipe-select'].value);
      const recipe = brewMenu?.profiles?.find((profile) => profile.slot === profileSlot)
        ?.recipes?.find((entry) => entry.slot === recipeSlot);
      brewSending = true;
      updateBrewButton();
      ui['brew-feedback'].textContent = t.sending;
      try {
        await homey.api('POST', `/brew-saved/${encodeURIComponent(deviceId)}`, {
          profileSlot, recipeSlot,
        });
        lastBrewSentAt = Date.now();
        pendingDrink = {
          name: recipe?.name || t.recipe,
          imageName: recipe?.imageName || null,
          id: recipe?.drinkId || null,
          requestedAt: lastBrewSentAt,
          seenBrewing: false,
        };
        ui['brew-feedback'].textContent = t.sent;
        ui['brew-panel'].hidden = true;
        if (lastStatus) render(lastStatus);
        refresh();
        for (const timeout of brewRefreshTimers) window.clearTimeout(timeout);
        brewRefreshTimers = [2500, 6000].map((delay) => window.setTimeout(refresh, delay));
      } catch (error) {
        ui['brew-feedback'].textContent = /already sent/i.test(error?.message || '') ? t.duplicate : t.brewFailed;
      } finally {
        brewSending = false;
        updateBrewButton();
      }
    }

    function render(status) {
      lastStatus = status;
      if (powerPending && status.powerOn === powerPending.enabled) {
        powerPending = null;
        if (powerPollTimer) window.clearTimeout(powerPollTimer);
        powerPollTimer = null;
      }
      ui['open-brew'].hidden = !status.savedRecipeControl;
      updatePowerButton();
      updateBrewButton();
      ui.device.textContent = status.deviceName || 'Philips Espresso';
      const state = status.available === false ? 'offline' : status.powerOn === false ? 'off' : status.state;
      const brewing = state === 'brewing';
      const named = brewing && Boolean(status.drinkName);
      if (named || (pendingDrink && (Date.now() - pendingDrink.requestedAt > 45000
        || ['offline', 'off', 'action_required', 'unrecoverable_error'].includes(state)
        || (pendingDrink.seenBrewing && !brewing)))) pendingDrink = null;
      if (pendingDrink && brewing) pendingDrink.seenBrewing = true;
      const requested = !named ? pendingDrink : null;
      ui.heading.textContent = t.heading;
      ui.badge.textContent = state === 'offline' ? t.offline : brewing ? t.brewing
        : state === 'action_required' ? t.action : state === 'unrecoverable_error' ? t.error
          : state === 'off' ? t.off : t.ready;
      ui.name.textContent = named ? status.drinkName : requested ? requested.name : brewing ? t.brewing
        : state === 'ready' || state === 'standby' || state === 'not_used' ? t.idle
          : state === 'off' ? t.off : state === 'rinsing' ? t.rinsing
            : state === 'offline' ? t.offline : state === 'action_required' ? t.action
              : state === 'unrecoverable_error' ? t.error : t.unknown;
      ui.detail.textContent = state === 'offline' ? t.offlineDetail : named ? t.selected : requested ? t.sent
        : brewing ? t.unreported : status.alert && status.alert !== 'not_used'
          ? status.alert.replaceAll('_', ' ') : state === 'ready' || state === 'standby' || state === 'not_used'
            ? t.readyDetail : t.waiting;
      renderDrinkImage(named ? status.drinkImageName || status.drinkName : requested?.imageName || requested?.name,
        named ? status.drinkId : requested?.id);
      renderMaintenance(status.maintenance);
      const progress = Number(status.progress);
      const hasProgress = brewing && status.progress !== null && Number.isFinite(progress);
      ui.progress.classList.toggle('active', brewing);
      ui.progress.classList.toggle('indeterminate', brewing && !hasProgress);
      ui.footer.hidden = !brewing;
      ui.fill.style.width = hasProgress ? `${Math.max(0, Math.min(100, progress))}%` : '';
      ui.percent.textContent = hasProgress ? `${Math.round(progress)}%` : '';
    }

    async function refresh() {
      if (!homey || !deviceId || refreshing || document.visibilityState === 'hidden') return;
      refreshing = true;
      try {
        render(await homey.api('GET', `/status/${encodeURIComponent(deviceId)}`, {}));
      } catch (error) {
        powerPending = null;
        if (powerPollTimer) window.clearTimeout(powerPollTimer);
        powerPollTimer = null;
        lastStatus = { canStartBrew: false, canControlPower: false, powerOn: null };
        updateBrewButton();
        updatePowerButton();
        ui.name.textContent = t.retry;
        ui.detail.textContent = t.offlineDetail;
        ui.badge.textContent = t.offline;
        renderDrinkImage(null, null);
        ui.progress.classList.remove('active', 'indeterminate');
        ui.footer.hidden = true;
        renderMaintenance(null);
        ui.percent.textContent = '';
      } finally { refreshing = false; }
    }

    function onHomeyReady(Homey) {
      homey = Homey;
      if (typeof Homey.__ === 'function') {
        t = Object.fromEntries(Object.keys(strings.en).map((key) => {
          const path = `widget.espressoNow.${key}`;
          let translated;
          try { translated = Homey.__(path); } catch (error) { translated = null; }
          return [key, typeof translated === 'string' && translated && translated !== path
            ? translated : strings.en[key]];
        }));
        let homeyLanguage;
        try { homeyLanguage = Homey.__('widget.espressoNow.language'); } catch (error) { homeyLanguage = null; }
        const activeLanguage = typeof homeyLanguage === 'string' && /^[a-z]{2}$/.test(homeyLanguage)
          ? homeyLanguage : 'en';
        if (document.documentElement) {
          document.documentElement.lang = activeLanguage;
          document.documentElement.dir = activeLanguage === 'ar' ? 'rtl' : 'ltr';
        }
        document.title = t.heading;
      }
      deviceId = (Homey.getDeviceIds() || [])[0];
      updatePowerButton();
      ui.heading.textContent = t.heading;
      ui.name.textContent = deviceId ? t.loading : t.choose;
      ui.detail.textContent = t.waiting;
      ui['open-brew'].textContent = t.openBrew;
      ui['panel-title'].textContent = t.panelTitle;
      ui['panel-close'].setAttribute('aria-label', t.close);
      ui['profile-label'].textContent = t.profile;
      ui['recipe-label'].textContent = t.recipe;
      ui['start-brew'].textContent = t.startBrew;
      ui['open-brew'].addEventListener('click', openBrewPanel);
      ui.power.addEventListener('click', togglePower);
      ui['panel-close'].addEventListener('click', () => { ui['brew-panel'].hidden = true; });
      ui['profile-select'].addEventListener('change', renderRecipeOptions);
      ui['recipe-select'].addEventListener('change', updateBrewButton);
      ui['start-brew'].addEventListener('click', startSavedBrew);
      Homey.ready();
      refresh();
      timer = window.setInterval(refresh, 15000);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
      window.addEventListener('pagehide', () => {
        window.clearInterval(timer);
        if (powerPollTimer) window.clearTimeout(powerPollTimer);
        for (const timeout of brewRefreshTimers) window.clearTimeout(timeout);
      }, { once: true });
    }

    if (new URLSearchParams(window.location.search).has('preview')) {
      const params = new URLSearchParams(window.location.search);
      if (params.get('theme') === 'dark') document.documentElement.classList.add('homey-dark-mode');
      onHomeyReady({ getDeviceIds: () => ['preview'], ready: () => {}, api: async () => ({
        deviceName: '8000 Serisi Café Aromis', available: true, state: 'brewing',
        drinkName: 'Cappuccino', drinkId: 14, drinkSource: 'homey_request', progress: 64, alert: null,
        savedRecipeControl: true, canStartBrew: false, powerOn: true, canControlPower: true,
        maintenance: { aquaclean: 100, descale: 98, coffee: 94, brewGroup: 88 },
      }) });
    }
  </script>
</body>
</html>
